name: GTM CI
on:
  push:
    branches:
      - gtm-intelligence-hub
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r gtm_intelligence_hub/requirements.txt
      - run: python -m compileall -q gtm_intelligence_hub
      - run: python -m unittest discover -s gtm_intelligence_hub/tests -v
